name: Cross-Platform CMake CI

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (needed for ctest on some images)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Make CI script executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ./ci.sh || true

      - name: Run CI script (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./ci.sh

      - name: Run CI script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          ci.bat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build/

      - name: Deploy (placeholder)
        run: |
          echo "Deploy step would run here"
